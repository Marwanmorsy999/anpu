# Dependabot keeps Go modules and GitHub Actions pinned near latest.
# Security updates land immediately; version bumps arrive as weekly PRs
# (CI must stay green before merge — the lint/vet/test/gosec gates run
# on every PR the same as on push).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
