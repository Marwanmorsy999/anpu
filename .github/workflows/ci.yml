name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs escalate only what they need.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed for Codecov's OIDC (tokenless) upload.
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Pinned rather than read from go.mod: govulncheck flags reachable
          # stdlib advisories (net/http, net/http/internal/http2, crypto/tls,
          # mime/multipart) that are fixed in Go 1.27.2+.
          go-version: '1.27.2'

      - name: Verify gofmt
        run: |
          UNFORMATTED=$(gofmt -l $(find . -name '*.go'))
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -20

      - name: Enforce coverage floor
        # Backstop against catastrophic coverage loss. The precise
        # per-PR ratchet ("fail PRs that drop coverage") lives in
        # codecov.yml (project target: auto); this floor only needs to
        # catch a broken harness. Baseline is ~11% (2026-09); raise this
        # floor as coverage grows — never lower it without a codecov.yml
        # change in the same PR.
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "total statement coverage: ${total}% (floor 10%)"
          python3 -c "import sys; cov = float(sys.argv[1]); sys.exit(0 if cov >= 10.0 else 1)" "$total"
          if [ $? -ne 0 ]; then echo "::error::total coverage ${total}% is below the 10% floor"; exit 1; fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage.out
          use_oidc: true
          fail_ci_if_error: false
          verbose: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          # v2 line (v1 binaries refuse go1.25+ targets at load).
          # Pinned exact; tree verified clean against this version.
          # Must be built with Go >= 1.27.2 to match the pinned toolchain:
          # v2.13.x is built with go1.27.1 and cannot decode go1.27.2
          # export data ("export data version 5 is greater than maximum
          # supported version 4"), which fails the lint job outright.
          version: v2.15.0

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./... > /tmp/vuln.txt 2>&1 || CODE=$?
          CODE=${CODE:-0}
          if [ "$CODE" -eq 0 ]; then echo "govulncheck: clean"; exit 0; fi
          if ! grep -q 'Your code is affected by' /tmp/vuln.txt; then cat /tmp/vuln.txt; exit "$CODE"; fi
          # Waived: GO-2026-5932 (x/crypto openpgp deprecation advisory,
          # fix N/A by design). Reachable only via package-init side
          # effects five hops deep (oob -> interactsh client ->
          # asnmap/libs -> utils/update -> go-github -> openpgp); ANPU
          # never calls openpgp, and the owning feature
          # (--oob-interactsh) is opt-in and off by default.
          # Re-evaluate if a fix version appears or the dep chain
          # changes. The gate fails on any OTHER affecting advisory.
          OTHER=$(grep -o 'GO-[0-9][0-9-]*' /tmp/vuln.txt | sort -u | grep -v -x 'GO-2026-5932' || true)
          if [ -n "$OTHER" ]; then echo "UNWAIVED advisories: $OTHER"; cat /tmp/vuln.txt; exit 1; fi
          echo "govulncheck: only waived GO-2026-5932 present"

  action-ref-check:
    name: action ref check (docs pin real tags)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fail on unresolvable action refs in docs
        run: |
          set -euo pipefail
          refs=$(grep -rhoE 'Marwanmorsy999/anpu/action@[A-Za-z0-9._/-]+' README.md docs action --include='*.md' | sed -E 's/.*action@//' | sort -u)
          echo "action refs found: $refs"
          fail=0
          for ref in $refs; do
            if git rev-parse --verify --quiet "refs/tags/$ref" >/dev/null; then
              echo "OK: tag $ref exists"
            else
              echo "::error::docs reference Marwanmorsy999/anpu/action@$ref but tag $ref does not exist"
              fail=1
            fi
          done
          exit $fail

      - name: gosec
        # gosec v2.29.0 (latest release) vendors x/tools v0.49.0, which
        # cannot decode Go 1.27.2 export data. It then reports
        # "package has type errors, skipping SSA analysis, no ssa result"
        # for most packages and exits non-zero while effectively finding
        # nothing. Rebuild it against x/tools v0.52.0 (pinned) so SSA
        # analysis genuinely runs on the pinned toolchain. Versions are
        # pinned exactly for reproducibility.
        run: |
          set -euo pipefail
          (
            tmp="$(mktemp -d)"
            cd "$tmp"
            go mod init gosec-build >/dev/null 2>&1
            printf 'package tools\n\nimport _ "github.com/securego/gosec/v2/cmd/gosec"\n' > tools.go
            go mod tidy
            go get github.com/securego/gosec/v2@v2.29.0
            go get golang.org/x/tools@v0.52.0
            go build -o "$RUNNER_TEMP/gosec" github.com/securego/gosec/v2/cmd/gosec
          )
          "$RUNNER_TEMP/gosec" ./...

  # Cross-platform matrix: the core gates (gofmt, build, vet, test) run on
  # all three release targets so a platform-specific break fails CI, not a
  # release. The deeper ubuntu-only job above keeps coverage/lint/security.
  portability:
    name: build/vet/test/gofmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows runners so `find`/`gofmt -l` behave the same.
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Pinned rather than read from go.mod: govulncheck flags reachable
          # stdlib advisories (net/http, net/http/internal/http2, crypto/tls,
          # mime/multipart) that are fixed in Go 1.27.2+.
          go-version: '1.27.2'

      - name: Verify gofmt
        run: |
          UNFORMATTED=$(gofmt -l $(find . -name '*.go'))
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # Live verification on each release OS: a safe-profile scan against a
  # local fixture confirms HTML/JSON/SARIF output, history storage, diff,
  # and the --fail-on gate actually work on the platform being released.
  verify:
    name: live verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Pinned rather than read from go.mod: govulncheck flags reachable
          # stdlib advisories (net/http, net/http/internal/http2, crypto/tls,
          # mime/multipart) that are fixed in Go 1.27.2+.
          go-version: '1.27.2'

      - name: Run live verification
        run: bash scripts/verify.sh

  # Relative markdown link check: every [text](target) whose target is not
  # an external URL or pure anchor must resolve to a file/dir in the repo.
  links:
    name: markdown link check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Verify relative markdown links
        run: |
          set -uo pipefail
          broken_links=$(
            while IFS= read -r md; do
              dir=$(dirname "$md")
              while IFS= read -r link; do
                case "$link" in
                  http://*|https://*|'#'*) continue ;;
                esac
                target="${link%%#*}"
                [ -z "$target" ] && continue
                if [ ! -e "$dir/$target" ]; then
                  echo "$md -> $link"
                fi
              done < <(grep -oE '\]\([^)]+\)' "$md" 2>/dev/null | sed -E 's/^\]\(//; s/\)$//')
            printf '%s\n' "$bad" | tr '\0' '\n'
          )
          if [ -n "$broken_links" ]; then
            echo "Broken markdown links:"
            echo "$broken_links"
            exit 1
          fi
          echo "All relative markdown links resolve."

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        run: docker build -t anpu:ci .

      - name: Build Nuclei variant image
        run: docker build --target anpu-nuclei -t anpu:ci-nuclei .

      - name: Smoke test images
        run: |
          set -euo pipefail
          # Default (nuclei-free) image: version + doctor must both run.
          docker run --rm anpu:ci version
          docker run --rm anpu:ci doctor
           # Nuclei variant: doctor must run and resolve the bundled nuclei
           # with an actual (non-empty) Nuclei version.
           docker run --rm anpu:ci-nuclei doctor | tee /tmp/nuclei-doctor.txt
           grep -Eq 'version[[:space:]]*:' /tmp/nuclei-doctor.txt
           if grep -q 'no version response' /tmp/nuclei-doctor.txt; then echo "::error::nuclei doctor did not report a version"; exit 1; fi

  # GoReleaser config validity + a real snapshot build. This is the local
  # equivalent of `goreleaser check && goreleaser release --snapshot`, so
  # a broken .goreleaser.yaml or a missing archive/SBOM fails CI rather
  # than only surfacing during a release tag.
  goreleaser-snapshot:
    name: goreleaser check + snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Pinned rather than read from go.mod: govulncheck flags reachable
          # stdlib advisories (net/http, net/http/internal/http2, crypto/tls,
          # mime/multipart) that are fixed in Go 1.27.2+.
          go-version: '1.27.2'

      - name: Install syft (SBOM generator)
        # Pinned; required on PATH for GoReleaser's sboms pipe.
        run: curl -sSfL https://get.anchore.io/syft | sh -s -- -b /usr/local/bin v1.40.0

      - name: Validate goreleaser config
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check

      - name: Snapshot build
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean

      - name: Verify snapshot artifacts
        run: |
          set -euo pipefail
          cd dist
           # 2 archive ids x 3 OS x 2 arch: tar.gz for linux/darwin, zip for windows.
           tgz=$(ls *.tar.gz 2>/dev/null | wc -l)
           zip=$(ls *.zip 2>/dev/null | wc -l)
           sbom=$(ls *.sbom.cyclonedx.json 2>/dev/null | wc -l)
           echo "tar.gz=$tgz zip=$zip sbom=$sbom"
           echo "--- dist listing ---"
           ls -1
           test "$tgz" -eq 8 || { echo "::error::expected 8 tar.gz archives, got $tgz"; exit 1; }
           test "$zip" -eq 4 || { echo "::error::expected 4 windows zip archives, got $zip"; exit 1; }
           test "$sbom" -ge 12 || { echo "::error::expected >=12 CycloneDX SBOMs, got $sbom"; exit 1; }
          test -f checksums.txt || { echo "::error::checksums.txt missing"; exit 1; }
          echo "snapshot artifacts OK"
  shellcheck:
    name: shellcheck (install.sh)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck install.sh

  # Gate: every tracked shell script must use LF line endings. A single CR
  # byte breaks install.sh/install.ps1 sourcing on Linux runners and is the
  # most common Windows/WSL checkout regression. Fails the job (and thus the
  # PR/merge) on any violation.
  line-endings:
    name: line endings (no CR in *.sh)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Fail on any CR byte in *.sh
        run: |
          set -euo pipefail
          bad=$(git grep -I -l -z $'\r' -- '*.sh' 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "::error::CRLF found in shell scripts (must be LF):"
            printf '%s\n' "$bad" | tr '\0' '\n'
            exit 1
          fi
          echo "All *.sh files use LF line endings."

  installer:
    name: installer (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:latest
            setup: apt-get update && apt-get install -y git curl tar coreutils
          - image: debian:latest
            setup: apt-get update && apt-get install -y git curl tar coreutils
          - image: fedora:latest
            setup: dnf install -y git curl tar coreutils
          - image: alpine:latest
            setup: apk add --no-cache git wget tar coreutils openssl
          - image: archlinux:latest
            setup: pacman -Sy --noconfirm git curl tar coreutils
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install prerequisites
        run: ${{ matrix.setup }}

      - name: Check out code
        uses: actions/checkout@v7

      - name: Run installer (pinned release)
        env:
          ANPU_VERSION: v0.5.1
        run: sh ./install.sh

      - name: Verify installed binary
        run: anpu version && anpu doctor

  installer-macos:
    name: installer (macos-latest)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run installer
        env:
          ANPU_VERSION: v0.5.1
        run: sh ./install.sh

      - name: Verify installed binary
        run: anpu version && anpu doctor

  installer-windows:
    name: installer (windows-latest)
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run installer
        env:
          ANPU_VERSION: v0.5.1
        run: ./install.ps1

      - name: Verify installed binary
        run: |
          $env:Path = "$env:LOCALAPPDATA\anpu\bin;$env:Path"
          anpu version
          anpu doctor

      - name: Uninstall check (exit 0, binary removed)
        env:
          ANPU_UNINSTALL: "1"
          ANPU_PURGE: "1"
        run: |
          $env:Path = "$env:LOCALAPPDATA\anpu\bin;$env:Path"
          ./install.ps1
          if (Test-Path "$env:LOCALAPPDATA\anpu\bin\anpu.exe") { Write-Error "uninstall left the binary behind"; exit 1 }

      - name: Pre-v0.4.0 pin prints a clear error
        env:
          ANPU_VERSION: v0.3.1
        run: |
          $out = & ./install.ps1 2>&1; $rc = $LASTEXITCODE
          if ($rc -eq 0) { Write-Error "v0.3.1 pin should have failed"; exit 1 }
          if ("$out" -notmatch "supports v0.4.0 and newer") { Write-Error "missing version-floor message: $out"; exit 1 }

  tamper:
    name: installer tamper test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Prepare tampered archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/tamper/v0.5.1
          curl -fsSL https://github.com/Marwanmorsy999/anpu/releases/download/v0.5.1/anpu_0.5.1_linux_amd64.tar.gz -o /tmp/tamper/v0.5.1/anpu_0.5.1_linux_amd64.tar.gz
          curl -fsSL https://github.com/Marwanmorsy999/anpu/releases/download/v0.5.1/checksums.txt -o /tmp/tamper/v0.5.1/checksums.txt
          printf x >> /tmp/tamper/v0.5.1/anpu_0.5.1_linux_amd64.tar.gz
          cd /tmp/tamper
          python3 -m http.server 8123 >/tmp/tamper/http.log 2>&1 &
          echo $! > /tmp/tamper/http.pid
          sleep 1

      - name: Run installer against tampered archive
        env:
          ANPU_VERSION: v0.5.1
          ANPU_BASE_URL: http://127.0.0.1:8123
        run: |
          set +e
          sh ./install.sh
          rc=$?
          kill "$(cat /tmp/tamper/http.pid)" 2>/dev/null || true
          if [ "$rc" -eq 0 ]; then
            echo "::error::tampered archive did not abort the installer"
            exit 1
          fi
          echo "installer aborted as expected (exit $rc)"

  installer-uninstall:
    name: installer uninstall + purge (ubuntu)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Fake HOME with binary + data dir
        run: |
          set -euo pipefail
          mkdir -p /tmp/fakehome/.config/anpu /tmp/fakebin
          touch /tmp/fakehome/.config/anpu/anpu.db /tmp/fakebin/anpu
      - name: Uninstall with purge (exit 0, success message, data dir gone)
        run: |
          set -euo pipefail
          out=$(ANPU_UNINSTALL=1 ANPU_PURGE=1 ANPU_INSTALL_DIR=/tmp/fakebin HOME=/tmp/fakehome sh ./install.sh 2>&1 </dev/null)
          echo "$out"
          echo "$out" | grep -q "removed anpu binary"
          echo "$out" | grep -q "removed data directory"
          test ! -e /tmp/fakebin/anpu
          test ! -e /tmp/fakehome/.config/anpu/anpu.db
          test ! -d /tmp/fakehome/.config/anpu

  installer-cosign-matrix:
    name: installer cosign matrix (${{ matrix.cosign }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cosign: [v2.4.1, v2.6.1]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install pinned cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: ${{ matrix.cosign }}
      - name: Install with pinned cosign (SHA-256 mandatory, sigstore conditional)
        run: |
          set -euo pipefail
          cosign version
          out=$(ANPU_VERSION=v0.5.1 ANPU_INSTALL_DIR=/tmp/cosign-bin sh ./install.sh 2>&1)
          echo "$out"
          echo "$out" | grep -q "installed to /tmp/cosign-bin/anpu"
          if [ "${{ matrix.cosign }}" = "v2.4.1" ]; then
            echo "$out" | grep -q "requires cosign >= v2.5.0"
          else
            echo "$out" | grep -q "verifying cosign signature"
          fi
          /tmp/cosign-bin/anpu version

  validation:
    name: validation (local fixture)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'

      - name: Run validation harness
        env:
          ANPU_ALLOW_LOCAL_NETWORK: "1"
        run: bash tests/validation/run.sh
  ghcr-anon:
    name: ghcr anonymous pull
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pull image anonymously
        run: |
          set -euo pipefail
          docker logout ghcr.io 2>/dev/null || true
          docker run --rm ghcr.io/marwanmorsy999/anpu version
