name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs escalate only what they need.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed for Codecov's OIDC (tokenless) upload.
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Pinned rather than read from go.mod: govulncheck flags reachable
          # stdlib advisories (net/http, net/http/internal/http2, crypto/tls,
          # mime/multipart, crypto/x509) that are fixed in Go 1.27.3+.
          go-version: '1.27.3'

      - name: Verify gofmt
        run: |
          UNFORMATTED=$(gofmt -l $(find . -name '*.go'))
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -20

      - name: Enforce coverage floor
        # Backstop against catastrophic coverage loss. The precise
        # per-PR ratchet ("fail PRs that drop coverage") lives in
        # codecov.yml (project target: auto); this floor only needs to
        # catch a broken harness. Baseline is ~11% (2026-09); raise this
        # floor as coverage grows — never lower it without a codecov.yml
        # change in the same PR.
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "total statement coverage: ${total}% (floor 10%)"
          python3 -c "import sys; cov = float(sys.argv[1]); sys.exit(0 if cov >= 10.0 else 1)" "$total"
          if [ $? -ne 0 ]; then echo "::error::total coverage ${total}% is below the 10% floor"; exit 1; fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage.out
          use_oidc: true
          fail_ci_if_error: false
          verbose: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          # v2 line (v1 binaries refuse go1.25+ targets at load).
          # Pinned exact; tree verified clean against this version.
          # Must be built with Go >= 1.27.3 to match the pinned toolchain:
          # v2.13.x is built with go1.27.1 and cannot decode go1.27.2+
          # export data ("export data version 5 is greater than maximum
          # supported version 4"), which fails the lint job outright.
          version: v2.15.0

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./... > /tmp/vuln.txt 2>&1 || CODE=$?
          CODE=${CODE:-0}
          if [ "$CODE" -eq 0 ]; then echo "govulncheck: clean"; exit 0; fi
          if ! grep -q 'Your code is affected by' /tmp/vuln.txt; then cat /tmp/vuln.txt; exit "$CODE"; fi
          # Waived: GO-2026-5932 (x/crypto openpgp deprecation advisory,
          # fix N/A by design). Reachable only via package-init side
          # effects five hops deep (oob -> interactsh client ->
          # asnmap/libs -> utils/update -> go-github -> openpgp); ANPU
          # never calls openpgp, and the owning feature
          # (--oob-interactsh) is opt-in and off by default.
          # Re-evaluate if a fix version appears or the dep chain
          # changes. The gate fails on any OTHER affecting advisory.
          OTHER=$(grep -o 'GO-[0-9][0-9-]*' /tmp/vuln.txt | sort -u | grep -v -x 'GO-2026-5932' || true)
          if [ -n "$OTHER" ]; then echo "UNWAIVED advisories: $OTHER"; cat /tmp/vuln.txt; exit 1; fi
          echo "govulncheck: only waived GO-2026-5932 present"

  action-ref-check:
    name: action ref check (docs pin real tags)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fail on unresolvable action refs in docs
        run: |
          set -euo pipefail
          refs=$(grep -rhoE 'Marwanmorsy999/anpu/action@[A-Za-z0-9._/-]+' README.md docs action --include='*.md' | sed -E 's/.*action@//' | sort -u)
          echo "action refs found: $refs"
          # Guard: zero refs means the grep pattern stopped matching (docs
          # renamed/moved), which would make this check vacuously pass.
          if [ -z "$refs" ]; then
            echo "::error::no Marwanmorsy999/anpu/action@<ref> references found in docs - the check is not scanning anything"
            exit 1
          fi
          fail=0
          for ref in $refs; do
            if git rev-parse --verify --quiet "refs/tags/$ref" >/dev/null; then
              echo "OK: tag $ref exists"
            else
              echo "::error::docs reference Marwanmorsy999/anpu/action@$ref but tag $ref does not exist"
              fail=1
            fi
          done
          exit $fail

      - name: gosec
        # gosec v2.29.0 (latest release) vendors x/tools v0.49.0, which
        # cannot decode Go 1.27.3 export data. It then reports
        # "package has type errors, skipping SSA analysis, no ssa result"
        # for most packages and exits non-zero while effectively finding
        # nothing. Rebuild it against x/tools v0.52.0 (pinned) so SSA
        # analysis genuinely runs on the pinned toolchain. Versions are
        # pinned exactly for reproducibility.
        run: |
          set -euo pipefail
          (
            tmp="$(mktemp -d)"
            cd "$tmp"
            go mod init gosec-build >/dev/null 2>&1
            printf 'package tools\n\nimport _ "github.com/securego/gosec/v2/cmd/gosec"\n' > tools.go
            go mod tidy
            go get github.com/securego/gosec/v2@v2.29.0
            go get golang.org/x/tools@v0.52.0
            go build -o "$RUNNER_TEMP/gosec" github.com/securego/gosec/v2/cmd/gosec
          )
          "$RUNNER_TEMP/gosec" ./...

  # Cross-platform matrix: the core gates (gofmt, build, vet, test) run on
  # all three release targets so a platform-specific break fails CI, not a
  # release. The deeper ubuntu-only job above keeps coverage/lint/security.
  portability:
    name: build/vet/test/gofmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows runners so `find`/`gofmt -l` behave the same.
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Pinned rather than read from go.mod: govulncheck flags reachable
          # stdlib advisories (net/http, net/http/internal/http2, crypto/tls,
          # mime/multipart, crypto/x509) that are fixed in Go 1.27.3+.
          go-version: '1.27.3'

      - name: Verify gofmt
        run: |
          UNFORMATTED=$(gofmt -l $(find . -name '*.go'))
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # Live verification on each release OS: a safe-profile scan against a
  # local fixture confirms HTML/JSON/SARIF output, history storage, diff,
  # and the --fail-on gate actually work on the platform being released.
  verify:
    name: live verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Pinned rather than read from go.mod: govulncheck flags reachable
          # stdlib advisories (net/http, net/http/internal/http2, crypto/tls,
          # mime/multipart, crypto/x509) that are fixed in Go 1.27.3+.
          go-version: '1.27.3'

      - name: Run live verification
        run: bash scripts/verify.sh

  # Relative markdown link check: every [text](target) whose target is not
  # an external URL or pure anchor must resolve to a file/dir in the repo.
  links:
    name: markdown link check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Verify relative markdown links
        run: |
          set -uo pipefail
          broken_links=$(
            while IFS= read -r md; do
              dir=$(dirname "$md")
              while IFS= read -r link; do
                case "$link" in
                  http://*|https://*|'#'*) continue ;;
                esac
                target="${link%%#*}"
                [ -z "$target" ] && continue
                if [ ! -e "$dir/$target" ]; then
                  echo "$md -> $link"
                fi
              done < <(grep -oE '\]\([^)]+\)' "$md" 2>/dev/null | sed -E 's/^\]\(//; s/\)$//')
            done < <(find . -name '*.md' -not -path './.git/*' -print0 | tr '\0' '\n')
          )
          if [ -n "$broken_links" ]; then
            echo "Broken markdown links:"
            echo "$broken_links"
            exit 1
          fi
          echo "All relative markdown links resolve."

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        run: docker build -t anpu:ci .

      - name: Build Nuclei variant image
        run: docker build --target anpu-nuclei -t anpu:ci-nuclei .

      - name: Smoke test images
        run: |
          set -euo pipefail
          # Default (nuclei-free) image: version + doctor must both run.
          docker run --rm anpu:ci version
          docker run --rm anpu:ci doctor
           # Nuclei variant: doctor must run and resolve the bundled nuclei
           # with an actual (non-empty) Nuclei version.
           docker run --rm anpu:ci-nuclei doctor | tee /tmp/nuclei-doctor.txt
           grep -Eq 'version[[:space:]]*:' /tmp/nuclei-doctor.txt
           if grep -q 'no version response' /tmp/nuclei-doctor.txt; then echo "::error::nuclei doctor did not report a version"; exit 1; fi

  # GoReleaser config validity + a real snapshot build. This is the local
  # equivalent of `goreleaser check && goreleaser release --snapshot`, so
  # a broken .goreleaser.yaml or a missing archive/SBOM fails CI rather
  # than only surfacing during a release tag.
  goreleaser-snapshot:
    name: goreleaser check + snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Pinned rather than read from go.mod: govulncheck flags reachable
          # stdlib advisories (net/http, net/http/internal/http2, crypto/tls,
          # mime/multipart, crypto/x509) that are fixed in Go 1.27.3+.
          go-version: '1.27.3'

      - name: Install syft (SBOM generator)
        # Pinned; required on PATH for GoReleaser's sboms pipe.
        run: curl -sSfL https://get.anchore.io/syft | sh -s -- -b /usr/local/bin v1.40.0

      - name: Validate goreleaser config
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check

      - name: Snapshot build
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean

      - name: Verify snapshot artifacts
        run: |
          set -euo pipefail
          cd dist
           # 2 archive ids x 3 OS x 2 arch: tar.gz for linux/darwin, zip for windows.
           tgz=$(ls *.tar.gz 2>/dev/null | wc -l)
           zip=$(ls *.zip 2>/dev/null | wc -l)
           sbom=$(ls *.sbom.cyclonedx.json 2>/dev/null | wc -l)
           echo "tar.gz=$tgz zip=$zip sbom=$sbom"
           echo "--- dist listing ---"
           ls -1
           test "$tgz" -eq 8 || { echo "::error::expected 8 tar.gz archives, got $tgz"; exit 1; }
           test "$zip" -eq 4 || { echo "::error::expected 4 windows zip archives, got $zip"; exit 1; }
           test "$sbom" -ge 12 || { echo "::error::expected >=12 CycloneDX SBOMs, got $sbom"; exit 1; }
          test -f checksums.txt || { echo "::error::checksums.txt missing"; exit 1; }
          echo "snapshot artifacts OK"
  shellcheck:
    name: shellcheck (install.sh)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck install.sh

      - name: Run shellcheck (CI helper scripts)
        run: shellcheck scripts/ci/nocurl-path.sh

  # Gate: every tracked shell script must use LF line endings. A single CR
  # byte breaks install.sh/install.ps1 sourcing on Linux runners and is the
  # most common Windows/WSL checkout regression. Fails the job (and thus the
  # PR/merge) on any violation.
  line-endings:
    name: line endings (no CR in *.sh)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Fail on any CR byte in *.sh
        run: |
          set -euo pipefail
          bad=$(git grep -I -l -z $'\r' -- '*.sh' 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "::error::CRLF found in shell scripts (must be LF):"
            printf '%s\n' "$bad" | tr '\0' '\n'
            exit 1
          fi
          echo "All *.sh files use LF line endings."

  installer:
    name: installer (${{ matrix.image }} ${{ matrix.fetch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:latest
            fetch: curl
            setup: apt-get update && apt-get install -y git curl tar coreutils
          - image: debian:latest
            fetch: curl
            setup: apt-get update && apt-get install -y git curl tar coreutils
          - image: fedora:latest
            fetch: curl
            setup: dnf install -y git curl tar coreutils
          - image: alpine:latest
            fetch: curl
            setup: apk add --no-cache git curl tar coreutils openssl ca-certificates
          # BusyBox wget variant: the GNU `wget` package is deliberately NOT
          # installed, so the installer must fall back to BusyBox's applet.
          - image: alpine:latest
            fetch: busybox-wget
            setup: apk add --no-cache git tar coreutils openssl ca-certificates
          - image: archlinux:latest
            fetch: curl
            setup: pacman -Sy --noconfirm git curl tar coreutils
          - image: kalilinux/kali-rolling
            fetch: curl
            setup: apt-get update && apt-get install -y git curl tar coreutils
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install prerequisites
        run: ${{ matrix.setup }}

      - name: Check out code
        uses: actions/checkout@v7

      - name: Assert the expected fetch tool
        run: |
          set -euo pipefail
          echo "curl: $(command -v curl || echo absent)"
          echo "wget: $(command -v wget || echo absent)"
          if [ "${{ matrix.fetch }}" = "curl" ]; then
            if ! command -v curl >/dev/null 2>&1; then
              echo "::error::the curl variant must have curl, but curl is absent"
              exit 1
            fi
          else
            if command -v curl >/dev/null 2>&1; then
              echo "::error::the ${{ matrix.fetch }} variant must have no curl, but curl is present"
              exit 1
            fi
            if ! command -v wget >/dev/null 2>&1; then
              echo "::error::the ${{ matrix.fetch }} variant must have wget, but wget is absent"
              exit 1
            fi
            if wget --help 2>&1 | grep -q -- '--no-verbose'; then
              echo "::error::expected BusyBox wget, found GNU wget"
              exit 1
            fi
            echo "BusyBox wget confirmed"
          fi

      - name: Run installer (pinned release)
        env:
          ANPU_VERSION: v0.5.6
        run: sh ./install.sh

      - name: Verify installed binary
        run: anpu version && anpu doctor

  installer-macos:
    name: installer (macos-latest)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run installer
        env:
          ANPU_VERSION: v0.5.6
        run: sh ./install.sh

      - name: Verify installed binary
        run: anpu version && anpu doctor

  installer-windows:
    name: installer (windows-latest, ${{ matrix.shell }})
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # powershell = Windows PowerShell 5.1 (Desktop), pwsh = PowerShell 7.
          - shell: pwsh
            exe: pwsh
          - shell: powershell
            exe: powershell
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run installer
        env:
          ANPU_VERSION: v0.5.6
        run: "& ${{ matrix.exe }} -File ./install.ps1"

      - name: Verify installed binary
        run: |
          $env:Path = "$env:LOCALAPPDATA\anpu\bin;$env:Path"
          anpu version
          anpu doctor

      - name: Uninstall check (exit 0, binary removed)
        env:
          ANPU_UNINSTALL: "1"
          ANPU_PURGE: "1"
        run: |
          $env:Path = "$env:LOCALAPPDATA\anpu\bin;$env:Path"
          & ${{ matrix.exe }} -File ./install.ps1
          if (Test-Path "$env:LOCALAPPDATA\anpu\bin\anpu.exe") { Write-Error "uninstall left the binary behind"; exit 1 }

      - name: Pre-v0.4.0 pin prints a clear error
        env:
          ANPU_VERSION: v0.3.1
        run: |
          # Windows PowerShell 5.1 turns a native command's stderr into a
          # terminating NativeCommandError as soon as it is merged into the
          # pipeline, which would abort this step before the assertions
          # run. Continue on error, assert explicitly, then exit 0.
          $ErrorActionPreference = 'Continue'
          $out = & ${{ matrix.exe }} -File ./install.ps1 2>&1
          $rc = $LASTEXITCODE
          if ($rc -eq 0) { Write-Error "v0.3.1 pin should have failed"; exit 1 }
          if ("$out" -notmatch "supports v0.4.0 and newer") { Write-Error "missing version-floor message: $out"; exit 1 }
          # The runner wrapper ends with `exit $LASTEXITCODE`; the pin is
          # *supposed* to exit 1, so reset the stale code once assertions pass.
          exit 0

  tamper:
    name: installer tamper test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Positive control first: prove the *clean* path really installs. Without
      # this, a tamper test that aborts for any reason (network, DNS, missing
      # release) would "pass" while proving nothing.
      - name: Positive control (clean archive installs)
        env:
          ANPU_VERSION: v0.5.6
        run: |
          set -euo pipefail
          rm -rf /tmp/ctrl-bin && mkdir -p /tmp/ctrl-bin
          out=$(ANPU_INSTALL_DIR=/tmp/ctrl-bin sh ./install.sh 2>&1)
          echo "$out"
          echo "$out" | grep -q "installed to /tmp/ctrl-bin/anpu"
          test -x /tmp/ctrl-bin/anpu
          /tmp/ctrl-bin/anpu version

      - name: Prepare tampered fixtures (zip-tamper + sums-tamper)
        run: |
          set -euo pipefail
          TAG=v0.5.6
          TARBALL="anpu_0.5.6_linux_amd64.tar.gz"
          rm -rf /tmp/tamper /tmp/tamper-sums
          mkdir -p "/tmp/tamper/$TAG" "/tmp/tamper-sums/$TAG"
          curl -fsSL "https://github.com/Marwanmorsy999/anpu/releases/download/$TAG/$TARBALL" -o "/tmp/tamper/$TAG/$TARBALL"
          curl -fsSL "https://github.com/Marwanmorsy999/anpu/releases/download/$TAG/checksums.txt" -o "/tmp/tamper/$TAG/checksums.txt"
          cp "/tmp/tamper/$TAG/$TARBALL" "/tmp/tamper-sums/$TAG/$TARBALL"
          cp "/tmp/tamper/$TAG/checksums.txt" "/tmp/tamper-sums/$TAG/checksums.txt"
          # Guard: fixtures must be non-empty, or the tamper below is vacuous.
          test -s "/tmp/tamper/$TAG/$TARBALL" || { echo "::error::tarball fixture empty"; exit 1; }
          test -s "/tmp/tamper/$TAG/checksums.txt" || { echo "::error::checksums fixture empty"; exit 1; }
          # Case A: corrupt the archive after download (append 1 byte).
          before=$(sha256sum "/tmp/tamper/$TAG/$TARBALL" | awk '{print $1}')
          printf x >> "/tmp/tamper/$TAG/$TARBALL"
          after=$(sha256sum "/tmp/tamper/$TAG/$TARBALL" | awk '{print $1}')
          echo "zip-tamper sha-before=$before sha-after=$after"
          test "$before" != "$after" || { echo "::error::zip tamper was inert"; exit 1; }
          # Case B: mutate ONE hex char of the tarball's published hash in
          # checksums.txt. Locate the entry by filename (never by a hardcoded
          # hash prefix) and confirm the clean archive matches the published
          # hash FIRST, so we know we compare against the right value.
          want0=$(awk -v f="$TARBALL" '$2 == f {print $1}' "/tmp/tamper-sums/$TAG/checksums.txt")
          got_clean=$(sha256sum "/tmp/tamper-sums/$TAG/$TARBALL" | awk '{print $1}')
          echo "sums-baseline published=$want0 clean=$got_clean"
          test -n "$want0" || { echo "::error::no published hash for $TARBALL"; exit 1; }
          test "$want0" = "$got_clean" || { echo "::error::clean fixture does not match published hash"; exit 1; }
          python3 - "/tmp/tamper-sums/$TAG/checksums.txt" "$TARBALL" <<'PYEOF'
          import re, sys
          path, target = sys.argv[1], sys.argv[2]
          out, changed, before, after = [], False, None, None
          for line in open(path, encoding="utf-8").read().splitlines(keepends=True):
              m = re.match(r"^([0-9a-fA-F]{64})(\s+.*)$", line)
              if m and not changed and target in line:
                  h = m.group(1)
                  # Replace the FIRST hex char with a character that is
                  # guaranteed to DIFFER from it. A fixed replacement
                  # character would be a no-op whenever the published hash
                  # happens to start with it (1 release in 16), which would
                  # make this case silently vacuous.
                  repl = "0" if h[0] != "0" else "1"
                  before = h.lower()
                  after = (repl + h[1:]).lower()
                  line = (after + m.group(2)) + ("\n" if line.endswith("\n") else "")
                  changed = True
              out.append(line)
          assert changed, "no checksum line matched"
          assert before is not None and after is not None, "hash not captured"
          assert before != after, "checksum mutation was inert"
          open(path, "w", encoding="utf-8").write("".join(out))
          print("sums-tamper: before=%s after=%s" % (before, after))
          PYEOF
          want1=$(awk -v f="$TARBALL" '$2 == f {print $1}' "/tmp/tamper-sums/$TAG/checksums.txt")
          echo "sums published-before=$want0 published-after=$want1"
          test "$want0" != "$want1" || { echo "::error::sums tamper was inert"; exit 1; }
          test "$want1" != "$got_clean" || { echo "::error::mutated published hash still matches the archive"; exit 1; }

      - name: Serve tampered fixtures
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --directory /tmp/tamper >/tmp/tamper/http.log 2>&1 &
          echo $! > /tmp/tamper/http.pid
          python3 -m http.server 8124 --directory /tmp/tamper-sums >/tmp/tamper-sums/http.log 2>&1 &
          echo $! > /tmp/tamper-sums/http.pid
          # Wait until both ports actually accept connections (no fixed sleep).
          for port in 8123 8124; do
            ok=0
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$port/"; then ok=1; break; fi
              sleep 1
            done
            if [ "$ok" -ne 1 ]; then echo "::error::port $port never became reachable"; exit 1; fi
          done

      - name: Tampered archive aborts the installer
        env:
          ANPU_VERSION: v0.5.6
          ANPU_BASE_URL: http://127.0.0.1:8123
          ANPU_ALLOW_CUSTOM_BASE_URL: "1"
        run: |
          set +e
          rm -rf /tmp/tamper-bin && mkdir -p /tmp/tamper-bin
          out=$(ANPU_INSTALL_DIR=/tmp/tamper-bin sh ./install.sh 2>&1)
          rc=$?
          set -e
          echo "$out"
          echo "installer exit=$rc"
          # Evidence the installer actually fetched OUR tampered tarball.
          grep -q "GET /v0.5.6/anpu_0.5.6_linux_amd64.tar.gz" /tmp/tamper/http.log || { echo "::error::installer never fetched the tampered tarball"; exit 1; }
          echo "$out" | grep -qi "checksum.*mismatch\|: FAILED\|hash.*mismatch" || { echo "::error::no checksum-mismatch message: $out"; exit 1; }
          if [ "$rc" -eq 0 ]; then echo "::error::tampered archive did not abort the installer"; exit 1; fi
          test ! -e /tmp/tamper-bin/anpu || { echo "::error::installer installed a binary despite checksum failure"; exit 1; }
          echo "installer aborted as expected (exit $rc), nothing installed"

      - name: Tampered checksums.txt aborts the installer
        env:
          ANPU_VERSION: v0.5.6
          ANPU_BASE_URL: http://127.0.0.1:8124
          ANPU_ALLOW_CUSTOM_BASE_URL: "1"
        run: |
          set +e
          rm -rf /tmp/tamper-sums-bin && mkdir -p /tmp/tamper-sums-bin
          out=$(ANPU_INSTALL_DIR=/tmp/tamper-sums-bin sh ./install.sh 2>&1)
          rc=$?
          set -e
          echo "$out"
          echo "installer exit=$rc"
          # Evidence the installer actually fetched OUR tampered checksums.txt.
          grep -q "GET /v0.5.6/checksums.txt" /tmp/tamper-sums/http.log || { echo "::error::installer never fetched the tampered checksums.txt"; exit 1; }
          echo "$out" | grep -qi "checksum.*mismatch\|: FAILED\|hash.*mismatch" || { echo "::error::no checksum-mismatch message: $out"; exit 1; }
          if [ "$rc" -eq 0 ]; then echo "::error::tampered checksums.txt did not abort the installer"; exit 1; fi
          test ! -e /tmp/tamper-sums-bin/anpu || { echo "::error::installer installed a binary despite checksum failure"; exit 1; }
          kill "$(cat /tmp/tamper/http.pid)" "$(cat /tmp/tamper-sums/http.pid)" 2>/dev/null || true
          echo "installer aborted as expected (exit $rc), nothing installed"

  installer-tamper-windows:
    name: installer tamper test (${{ matrix.shell }})
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # powershell = Windows PowerShell 5.1, pwsh = PowerShell 7.
          - shell: pwsh
            exe: pwsh
          - shell: powershell
            exe: powershell
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download the published release assets
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.5.6'
          $asset = "anpu_$($tag.TrimStart('v'))_windows_amd64.zip"
          $dir = Join-Path $env:RUNNER_TEMP 'anpu-tamper-fixtures'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $base = "https://github.com/Marwanmorsy999/anpu/releases/download/$tag"
          Invoke-WebRequest -Uri "$base/$asset" -OutFile (Join-Path $dir $asset) -UseBasicParsing
          Invoke-WebRequest -Uri "$base/checksums.txt" -OutFile (Join-Path $dir 'checksums.txt') -UseBasicParsing
          # Guard: empty fixtures would make every case vacuous.
          foreach ($f in @($asset, 'checksums.txt')) {
            $len = (Get-Item (Join-Path $dir $f)).Length
            Write-Host "fixture $f bytes=$len"
            if ($len -le 0) { Write-Error "fixture $f is empty"; exit 1 }
          }

      - name: Tamper test install.ps1 (${{ matrix.shell }})
        run: |
          # Windows PowerShell 5.1 turns a native command's stderr into a
          # terminating NativeCommandError as soon as it is merged into the
          # pipeline, so collect the output explicitly.
          $ErrorActionPreference = 'Continue'
          $work = Join-Path $env:RUNNER_TEMP 'anpu-tamper-work'
          $fixtures = Join-Path $env:RUNNER_TEMP 'anpu-tamper-fixtures'
          & ${{ matrix.exe }} -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/installers/tamper-windows.ps1 -FixtureDir $fixtures -Version v0.5.6 -WorkDir $work -ShellExe ${{ matrix.exe }} -InstallScript "${{ github.workspace }}\install.ps1" -Port 18241 2>&1 | ForEach-Object { $_.ToString() }
          $rc = $LASTEXITCODE
          Write-Host "harness exit=$rc"
          if ($rc -ne 0) { Write-Error "tamper harness failed (exit $rc)"; exit 1 }
          # Independent assertions on the harness summary, so a harness that
          # exits 0 without running the cases cannot pass this job.
          $summary = Join-Path $work 'summary.txt'
          if (-not (Test-Path $summary)) { Write-Error "no summary written by the harness"; exit 1 }
          $lines = Get-Content $summary
          $lines | ForEach-Object { Write-Host "SUMMARY $_" }
          foreach ($name in @('clean', 'zip-tamper', 'sums-tamper')) {
            $line = $lines | Where-Object { $_ -like "name=$name *" } | Select-Object -First 1
            if ($null -eq $line) { Write-Error "case $name missing from the summary"; exit 1 }
            if ($line -notlike '*verdict=success*') { Write-Error "case $name did not succeed: $line"; exit 1 }
          }
          # The deliberately wrong control must have been CONCLUDED as a
          # failure by the harness; that is the non-vacuity control for the
          # abort detection itself.
          $control = $lines | Where-Object { $_ -like 'name=control-wrong *' } | Select-Object -First 1
          if ($null -eq $control) { Write-Error "control-wrong case missing from the summary"; exit 1 }
          if ($control -notlike '*verdict=failure*') { Write-Error "control-wrong must conclude failure: $control"; exit 1 }
          Write-Host "Windows tamper test OK: clean install, tampered archive, tampered checksums.txt; control concluded failure"

  installer-base-url-guard:
    name: installer base URL guard (linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: ANPU_BASE_URL guard tests (install.sh)
        run: |
          set -uo pipefail
          out=$(sh tests/installers/base-url-guard.sh v0.5.6 2>&1)
          rc=$?
          echo "$out"
          echo "guard script exit=$rc"
          test "$rc" -eq 0 || { echo "::error::the base URL guard tests failed"; exit 1; }
          echo "$out" | grep -q "GUARD-RESULT failures=0" || { echo "::error::no GUARD-RESULT line"; exit 1; }
          # Guard against a vacuous pass: every case must have run.
          for c in custom-no-allow custom-allowed default-base official-base; do
            echo "$out" | grep -q "case=$c " || { echo "::error::case $c did not run"; exit 1; }
          done
          # The refusal must be real: the custom-no-allow case has to report
          # a non-zero exit and nothing installed.
          echo "$out" | grep -q "case=custom-no-allow check=non-zero-exit verdict=success" || { echo "::error::custom-no-allow did not report a non-zero exit"; exit 1; }
          echo "$out" | grep -q "case=custom-no-allow check=nothing-installed verdict=success" || { echo "::error::custom-no-allow installed something"; exit 1; }
          echo "$out" | grep -q "case=custom-allowed check=warning-printed verdict=success" || { echo "::error::custom-allowed did not print the warning"; exit 1; }
          echo "$out" | grep -q "case=default-base check=no-warning verdict=success" || { echo "::error::the default base URL printed the warning"; exit 1; }

  installer-base-url-guard-windows:
