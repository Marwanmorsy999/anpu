          $ErrorActionPreference = 'Continue'
          $work = Join-Path $env:RUNNER_TEMP 'anpu-guard-work'
          $fixtures = Join-Path $env:RUNNER_TEMP 'anpu-tamper-fixtures'
          $env:GUARD_SHELL_EXE = '${{ matrix.exe }}'
          $out = & ${{ matrix.exe }} -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/installers/base-url-guard.ps1 -InstallScript "${{ github.workspace }}\install.ps1" -FixtureDir $fixtures -Version v0.5.6 -WorkDir $work -Port 18251 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          Write-Host "guard script exit=$rc"
          if ($rc -ne 0) { Write-Error "the base URL guard tests failed"; exit 1 }
          if ($out -notmatch 'GUARD-RESULT failures=0') { Write-Error "no GUARD-RESULT line"; exit 1 }
          # Guard against a vacuous pass: every case must have run.
          foreach ($c in @('custom-no-allow', 'custom-allowed', 'default-base', 'official-base')) {
            if ($out -notmatch "case=$c ") { Write-Error "case $c did not run"; exit 1 }
          }
          if ($out -notmatch 'case=custom-no-allow check=non-zero-exit verdict=success') { Write-Error "custom-no-allow did not report a non-zero exit"; exit 1 }
          if ($out -notmatch 'case=custom-no-allow check=nothing-installed verdict=success') { Write-Error "custom-no-allow installed something"; exit 1 }
          if ($out -notmatch 'case=custom-allowed check=warning-printed verdict=success') { Write-Error "custom-allowed did not print the warning"; exit 1 }
          if ($out -notmatch 'case=default-base check=no-warning verdict=success') { Write-Error "the default base URL printed the warning"; exit 1 }

