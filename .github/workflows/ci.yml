name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify gofmt
        run: |
          UNFORMATTED=$(gofmt -l $(find . -name '*.go'))
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race ./...

      - name: Coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./... && go tool cover -func=coverage.out | tail -20

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Exact patch: the action cannot resolve minor-only tags, and
          # this is the version the tree is verified clean against.
          version: v1.64.8

      # TEMPORARY diagnostic (remove once the 1-second exit-3 is
      # understood): re-runs the same linter directly and surfaces its
      # output as annotations, which are readable without log access.
      - name: Diagnose lint (temporary)
        if: always()
        run: |
          echo "::notice::DIAG $(go version) GOTOOLCHAIN=$(go env GOTOOLCHAIN)"
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 2>&1 | tail -1
          set +e
          golangci-lint run ./... > /tmp/lint-direct.log 2>&1
          echo "::notice::DIAG direct exit: $?"
          head -30 /tmp/lint-direct.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | while IFS= read -r line; do echo "::error::DIAG $line"; done
          exit 0

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t anpu:ci .
