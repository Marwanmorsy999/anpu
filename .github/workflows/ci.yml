          foreach ($f in @($asset, 'checksums.txt')) {
            $len = (Get-Item (Join-Path $dir $f)).Length
            Write-Host "fixture $f bytes=$len"
            if ($len -le 0) { Write-Error "fixture $f is empty"; exit 1 }
          }

      - name: ANPU_BASE_URL guard tests (install.ps1)
        run: |
          # Windows PowerShell 5.1 turns a native command's stderr into a
