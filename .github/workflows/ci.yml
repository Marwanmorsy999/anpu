    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Missing ANPU_INSTALL_DIR is created (not "not writable")
        run: |
          set -euo pipefail
          rm -rf /tmp/missing-parent
          mkdir -p /tmp/missing-parent
          MISSING_DIR=/tmp/missing-parent/nested/bin
          test ! -e "$MISSING_DIR"
          out=$(ANPU_VERSION=v0.5.6 ANPU_INSTALL_DIR="$MISSING_DIR" sh ./install.sh 2>&1)
          echo "$out"
          if echo "$out" | grep -q "is not writable"; then
            echo "::error::missing dir misreported as not writable: $out"
            exit 1
          fi
          echo "$out" | grep -q "installed to $MISSING_DIR/anpu"
          test -x "$MISSING_DIR/anpu"
          "$MISSING_DIR/anpu" version

  installer-cosign-matrix:
    name: installer cosign matrix (${{ matrix.cosign }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cosign: [v2.4.1, v2.6.1]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install pinned cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: ${{ matrix.cosign }}
      - name: Install with pinned cosign (SHA-256 mandatory, sigstore conditional)
        run: |
          set -euo pipefail
          cosign version
          out=$(ANPU_VERSION=v0.5.6 ANPU_INSTALL_DIR=/tmp/cosign-bin sh ./install.sh 2>&1)
          echo "$out"
          echo "$out" | grep -q "installed to /tmp/cosign-bin/anpu"
          if [ "${{ matrix.cosign }}" = "v2.4.1" ]; then
            echo "$out" | grep -q "requires cosign >= v2.5.0"
          else
            echo "$out" | grep -q "verifying cosign signature"
          fi
          /tmp/cosign-bin/anpu version

  validation:
    name: validation (local fixture)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'

      - name: Run validation harness
        env:
          ANPU_ALLOW_LOCAL_NETWORK: "1"
        run: bash tests/validation/run.sh
  ghcr-anon:
    name: ghcr anonymous pull
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pull image anonymously
        run: |
          set -euo pipefail
          docker logout ghcr.io 2>/dev/null || true
          docker run --rm ghcr.io/marwanmorsy999/anpu version
