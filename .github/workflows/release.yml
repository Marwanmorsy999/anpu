name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download published Linux amd64 artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/anpu-release
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "anpu_*_linux_amd64.tar.gz" \
            --dir /tmp/anpu-release
          test -n "$(find /tmp/anpu-release -name 'anpu_*_linux_amd64.tar.gz' -print -quit)"

      - name: Smoke test published artifact
        run: |
          set -euo pipefail
          archive="$(find /tmp/anpu-release -name 'anpu_*_linux_amd64.tar.gz' -print -quit)"
          rm -rf /tmp/anpu-bin
          mkdir -p /tmp/anpu-bin
          tar -xzf "$archive" -C /tmp/anpu-bin
          /tmp/anpu-bin/anpu --version
          /tmp/anpu-bin/anpu --help >/dev/null
