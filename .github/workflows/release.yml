name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege: no workflow-level writes (Scorecard Token-Permissions
# flags those). The release job escalates only what publishing, keyless
# cosign signing, and SLSA attestations require.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the GitHub Release
      id-token: write # OIDC for keyless cosign + attestations
      attestations: write # persist attestations to the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install syft (SBOM generator)
        # Pinned; required on PATH for GoReleaser's sboms pipe.
        run: curl -sSfL https://get.anchore.io/syft | sh -s -- -b /usr/local/bin v1.40.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts (SLSA provenance)
        # GitHub artifact attestations bind every file listed in
        # GoReleaser's checksums.txt to SLSA build provenance
        # (in-toto format, Sigstore-signed). Anyone can verify with:
        #   gh attestation verify <file> --repo Marwanmorsy999/anpu
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums with cosign (keyless)
        # One keyless signature over checksums.txt covers every release
        # artifact transitively. The bundle holds signature + Fulcio
        # certificate + Rekor transparency proof. Verify with:
        #   cosign verify-blob --bundle checksums.txt.sigstore.json \
        #     --certificate-identity-regexp 'https://github.com/Marwanmorsy999/anpu/.github/workflows/release.yml@refs/tags/.*' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     checksums.txt
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt
          test -s dist/checksums.txt.sigstore.json

      - name: Upload signature bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/checksums.txt.sigstore.json --clobber

      - name: Download published artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/anpu-release
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "anpu_*_linux_amd64.tar.gz" \
            --dir /tmp/anpu-release
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "checksums.txt*" \
            --dir /tmp/anpu-release
          test -n "$(find /tmp/anpu-release -name 'anpu_*_linux_amd64.tar.gz' -print -quit)"
          test -f /tmp/anpu-release/checksums.txt
          test -f /tmp/anpu-release/checksums.txt.sigstore.json

      - name: Smoke test published artifact
        run: |
          set -euo pipefail
          archive="$(find /tmp/anpu-release -name 'anpu_*_linux_amd64.tar.gz' -print -quit)"
          rm -rf /tmp/anpu-bin
          mkdir -p /tmp/anpu-bin
          tar -xzf "$archive" -C /tmp/anpu-bin
          /tmp/anpu-bin/anpu --version
          /tmp/anpu-bin/anpu --help >/dev/null

      - name: Verify release signature and provenance
        # The workflow eats its own cooking: checksum, cosign bundle,
        # and SLSA attestation are all verified against the files a
        # user would download before the release is considered good.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/anpu-release
          archive="$(find /tmp/anpu-release -name 'anpu_*_linux_amd64.tar.gz' -print -quit)"
          sha256sum -c <(grep "  $(basename "$archive")$" checksums.txt)
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            checksums.txt
          gh attestation verify "$archive" --repo "${{ github.repository }}"
