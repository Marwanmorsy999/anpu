name: "ANPU Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly (Mondays at 03:00 UTC): catches tool/image drift without
    # re-scanning an unchanged local fixture every day.
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Self-hosted vulnerable fixture: OWASP Juice Shop served on the
    # runner's own loopback. The scan never targets third-party hosts.
    # NOTE: Juice Shop v20+ images are distroless (no shell/wget/curl), so
    # an in-container health check is impossible. Readiness is enforced
    # host-side by the wait step below. The pinned digest prevents fixture
    # drift from breaking the self-test.
    services:
      juice-shop:
        # Pinned to an immutable digest (OWASP Juice Shop v20.2.0) so
        # fixture drift cannot break the self-test. To update: verify the
        # new image, then swap the digest below.
        image: bkimminich/juice-shop@sha256:73c53fbf442e8337b3ea3d98c7e8550308854701ebdfce4cc39768f36b75430e
        ports: [ "3000:3000" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build ANPU
        run: go build -o anpu ./cmd/anpu

      - name: Wait for Juice Shop (host-side readiness)
        run: |
          set -euo pipefail
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "juice-shop is up (attempt $i)"; ok=1; break
            fi
            echo "waiting for juice-shop ($i/30)..."; sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::juice-shop did not become ready in 60s"
            cid=$(docker ps -q --filter ancestor=bkimminich/juice-shop@sha256:73c53fbf442e8337b3ea3d98c7e8550308854701ebdfce4cc39768f36b75430e || true)
            [ -n "$cid" ] && docker logs "$cid" || true
            exit 1
          fi

      - name: Run ANPU Scan (self-test against local fixture)
        env:
          # Required by internal/scanner/target.go to permit loopback targets.
          # NEVER enable this against hosts you do not own.
          ANPU_ALLOW_LOCAL_NETWORK: "1"
        run: |
          mkdir -p ./reports
          ./anpu scan http://127.0.0.1:3000 \
            --profile safe \
            --sarif --json --html=false \
            --output ./reports/

      - name: Assert SARIF Report Validity
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          sarif_files=(./reports/*.sarif)
          if [ "${#sarif_files[@]}" -ne 1 ]; then
            echo "Expected exactly one SARIF file in ./reports/, found ${#sarif_files[@]}" >&2
            ls -la ./reports/ || true
            exit 1
          fi
          jq -e '.runs[0].tool.driver.name == "ANPU"' "${sarif_files[0]}"
          # The TLS stage deterministically emits findings against a
          # plain-HTTP fixture, so results are guaranteed non-empty.
          jq -e '.runs[0].results | length >= 1' "${sarif_files[0]}"

      - name: Upload SARIF Report
        # Runs even when scan/assertions failed so partial results still
        # reach the Security tab. Skipped for fork PRs, which receive a
        # read-only token (upload would 403).
        # If this repo ever becomes private without GHAS, swap this step
        # for actions/upload-artifact (upload-sarif requires code scanning).
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./reports/*.sarif
          category: anpu-scan
