version: 2

project_name: anpu

before:
  hooks:
    - go test ./...

builds:
  - id: anpu
    main: ./cmd/anpu
    binary: anpu
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/Marwanmorsy999/anpu/pkg/version.Version={{.Version}} -X github.com/Marwanmorsy999/anpu/pkg/version.Commit={{.ShortCommit}}

archives:
  - id: anpu
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      # Windows users expect zip (Explorer opens it natively).
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - anpu.example.yaml

# Native Linux packages (deb/rpm/apk/archlinux) via nFPM — no extra
# toolchain needed. These make `apt/dnf/apk/pacman install ./anpu*.deb`
# work and are the stepping stone to Kali/BlackArch/AUR submissions.
nfpms:
  - id: anpu
    package_name: anpu
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    maintainer: ANPU Contributors <https://github.com/Marwanmorsy999/anpu>
    description: Guard what you build. Authorized web security analysis and attack-surface intelligence CLI.
    homepage: https://github.com/Marwanmorsy999/anpu
    license: Apache-2.0
    bindir: /usr/bin
    section: net
    priority: optional
    contents:
      - src: README.md
        dst: /usr/share/doc/anpu/README.md
      - src: LICENSE
        dst: /usr/share/doc/anpu/LICENSE
      - src: anpu.example.yaml
        dst: /usr/share/doc/anpu/anpu.example.yaml

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Marwanmorsy999
    name: anpu
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
