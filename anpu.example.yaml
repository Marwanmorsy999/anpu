# Example ANPU configuration file. Copy to anpu.yaml in your working
# directory, or pass --config /path/to/this/file.
#
# CLI flags always override values here. See README.md → "Scan profiles"
# for what each profile enables by default.

target:
  url: https://example.com

scan:
  profile: safe   # safe | standard | deep

modules:
  recon: true
  technology: true
  tls: true
  headers: true
  cookies: true
  endpoints: true
  nuclei: true    # only takes effect if the nuclei binary is installed
  zap: false      # not yet implemented (see internal/integrations/zap.go)

report:
  html: true
  json: true
  sarif: false
