# Example ANPU configuration file. Copy to anpu.yaml in your working
# directory, or pass --config /path/to/this/file.
#
# CLI flags always override values here. See README.md → "Scan profiles"
# for profile defaults.

target:
  url: https://example.com

scan:
  profile: safe   # safe | standard | deep

modules:
  recon: true
  technology: true
  tls: true
  headers: true
  cookies: true
  endpoints: true
  subdomains: false
  portscan: false
  dirs: false
  secrets: false
  cors: false
  methods: false
  nuclei: false   # optional; enable explicitly or use an active profile
  zap: false      # planned; driver is not implemented yet

report:
  html: true
  json: true
  sarif: false

# Authentication context — all fields are optional.
# ANPU never guesses or brute-forces credentials.
# Authentication is always opt-in and explicit.
#
# SECURITY: Never commit real credentials to source control.
# Pass sensitive values via CLI flags or environment substitution.
#
# auth:
#   method: bearer          # none | bearer | cookie | header
#   token: ""               # used when method: bearer
#   cookies:                # used when method: cookie
#     - session=abc123
#     - csrf=xyz789
#   headers:                # used when method: header
#     - "X-Api-Key: mykey"
#   role: user              # label for this identity (default: user / anonymous)

# Authorization comparison testing (Phase 3).
# Supply a second identity to probe every discovered endpoint under both
# the primary (--auth-*) and challenger (--authz-*) contexts.
# ANPU flags responses that differ in access-control-relevant ways.
#
# Example: scan as admin (context A) and compare against user (context B)
#   anpu scan https://app.example.com \
#     --auth-token <admin-token> --auth-role admin \
#     --authz-token <user-token> --authz-role user
#
# Or: scan as authenticated user and compare against anonymous
#   anpu scan https://app.example.com \
#     --auth-cookie "session=abc" --auth-role user \
#     --authz-role anonymous
